<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Administrativo | Fisius</title>
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="login-body">
  <div class="login-card">
    <img src="../assets/img/logo-fisius-transparente.png" class="login-logo" alt="Fisius">
    <h1>Acesso administrativo</h1>
    <p>Área interna da clínica</p>
    <form id="loginForm">
      <input id="email" type="email" value="admin@fisius.com" required>
      <input id="senha" type="password" value="123456" required>
      <button>Entrar</button>
      <small class="hint">Demo: admin@fisius.com / 123456</small>
      <p id="loginMsg" class="login-msg"></p>
    </form>
  </div>
  <script src="../js/admin.js"></script>
</body>
</html>
